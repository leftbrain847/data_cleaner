# Runs whatever tests the repo has, from a clean checkout. Add a runner below if you use another stack.
name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Node tests
        if: hashFiles('package.json') != ''
        run: npm ci || npm install; npm test --if-present
      - name: Plain JS tests
        if: hashFiles('package.json') == '' && hashFiles('**/*.test.js', '**/*.test.mjs') != ''
        run: node --test
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: hashFiles('requirements*.txt', 'pyproject.toml') != ''
        with:
          python-version: "3.12"
      - name: Python tests
        if: hashFiles('tests/**/*.py', 'pyproject.toml', 'requirements*.txt') != ''
        run: |
          pip install -q pytest
          [ -f requirements.txt ] && pip install -q -r requirements.txt || true
          [ -f pyproject.toml ] && pip install -q -e . || true
          pytest -q
      - name: Pipeline runs end to end and passes its own eval
        if: hashFiles('data_cleaner/__main__.py') != ''
        run: python -m data_cleaner
      - name: Sprint site check on day snapshots
        # The nightly refresh holds back any day page that loads a third-party file neither self-hosted nor pinned
        # by hash. Same check here, markup only, so a bad snapshot fails its own PR instead of a 404 hours later.
        # Only today's and yesterday's snapshots (ET): older ones are frozen and can't be fixed, so they never
        # turn CI red. Runs J's public index_engine at main (its rules change there); read-only token, no secrets.
        if: hashFiles('snapshots/*.html') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          for d in "$(TZ=America/New_York date +%F)" "$(TZ=America/New_York date -d yesterday +%F)"; do
            for f in snapshots/"$d"*.html; do [ -e "$f" ] && cp "$f" "$RUNNER_TEMP/snapshots/"; done
          done
          if [ -z "$(ls -A "$RUNNER_TEMP/snapshots")" ]; then echo "no snapshot from today or yesterday to check"; exit 0; fi
          git clone -q --depth 1 https://github.com/leftbrain847/index_engine "$RUNNER_TEMP/engine"
          pip install -q pyyaml==6.0.3
          python "$RUNNER_TEMP/engine/tools/site_check.py" "$RUNNER_TEMP/snapshots" --no-browser
